recent:
    layout: recent
    rss: # /atom.xml # npm i hexo-generator-feed
    limit: 10 # Count of posts
toc:
    layout: toc
    list_number: false # 是否显示序号
    min_depth: 2
    max_depth: 5
    fallback: recent # Use a backup widget when toc does not exist.
ghuser:
    layout: ghuser
    api: https://api.github.com
    username: zhang-qp03 # your github login username
    avatar: true # show avatar or not
    menu: false # show menu or not
welcome:
    layout: markdown
    title: 欢迎来到小张同学的学习世界
    content: 小张同学在这里记录医学学习中的所思所得，分享自己的所见所感。
timeline:
    layout: timeline
    title: '<a href="https://github.com/zhang-qp03/zhang-qp03.github.io/issues" style="color:#03c7fa">近期动态</a>'
    api: https://api.github.com/repos/zhang-qp03/zhang-qp03.github.io/issues?per_page=7 # 若你想限制数量，在api链接后面加上?per_page=1指限制为1条
    user: zhang-qp03 # 是否过滤只显示某个人发布的内容，如果要筛选多人，用英文逗号隔开
    hide: # title,footer # 隐藏标题或底部 # 此功能需要 Stellar v1.13.0

related:
    layout: related


# 标签云组件
tagcloud:
  layout: tagcloud
  title: 标签索引
  # 标签云配置
  min_font: 12
  max_font: 24
  amount: 100
  orderby: name
  order: 1 # 1, sac 升序；-1, desc 降序
  color: false # 使用颜色
  start_color: # 开始的颜色。您可使用十六进位值（#b700ff），rgba（rgba(183, 0, 255, 1)），hsla（hsla(283, 100%, 50%, 1)）或 颜色关键字。此变量仅在 color 参数开启时才有用。
  end_color: # 结束的颜色。您可使用十六进位值（#b700ff），rgba（rgba(183, 0, 255, 1)），hsla（hsla(283, 100%, 50%, 1)）或 颜色关键字。此变量仅在 color 参数开启时才有用。
  show_count: false # 显示每个标签的文章总数
categories:
	layout: categories
	title: 分类索引

randomdoc:
  layout: markdown
  title: ''
  linklist:
    columns: 1
    items:
      - icon: '<img src="https://api.iconify.design/ion:dice-outline.svg"/>'
        title: 随机抽一篇文章吧
        url: 'javascript:toRandomPost()'
  content: |
    <span id="welcome-info" ></span>



